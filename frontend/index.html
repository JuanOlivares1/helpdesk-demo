<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color" content="#f6f8f7" />
    <script>
      // Apply the saved theme before painting so the first frame is correct.
      (() => {
        try {
          const choice = localStorage.getItem("theme");
          const dark =
            choice === "dark" ||
            (choice !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document
            .getElementById("theme-color")
            ?.setAttribute("content", dark ? "#0e1518" : "#f6f8f7");
        } catch {
          // Storage can be unavailable; the CSS default remains light.
        }
      })();
    </script>
    <meta
      name="description"
      content="Track, triage, and resolve support requests in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <title>HelpDesk — Support tickets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
